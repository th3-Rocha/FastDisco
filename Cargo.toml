[package]
name = "discofast"
version = "0.50.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native Discord client"
repository = "https://github.com/th3-Rocha/FastDisco"
keywords = ["discord", "chat", "egui"]

[dependencies]
anyhow = "1"
log = "0.4"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D chat client.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "svg", "gif", "webp"] }
# Avatars, icons, attachments and stickers. GIF and WebP animate through
# egui_extras' loaders.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# The app icon, drawn from assets/icon.svg. The version egui_extras
# already brings in for SVG.
resvg = { version = "0.45.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Discord's own stickers (Wumpus and the rest) are Lottie animations:
# velato reads them and the vello_cpu egui already brings draws the frames.
velato = { version = "0.12", default-features = false }
vello_cpu = { version = "0.1.0", default-features = false, features = ["std", "u8_pipeline"] }
# The shared foundation of Spotifast and ZapFast (crmne/fastframe). Every
# crate comes from the same tag; move them together.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Colour emoji in the platform's own style, in every text through its egui
# plugin.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Palette files, and following the Omarchy desktop's theme live.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Settings written whole, never half, off the interface thread.
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Keeps Discofast running without a window, in the tray, and recreates
# the window on demand (Wayland cannot hide one).
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# One running copy: a second launch brings the window of the first.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Desktop notifications for direct messages and mentions.
fastframe-notifications = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Starting at login, through the desktop's own autostart.
fastframe-autostart = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
# Updating itself from GitHub releases: signed checksums, a helper that
# swaps the executable, and going back if the new one does not start.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1", features = ["reqwest"] }
# The per-user config, state and cache folders.
fastframe-dirs = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Network work runs here, never on the interface thread.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# rustls everywhere, so the client builds without OpenSSL on every platform.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "multipart", "stream", "blocking"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# The QR login: Discord encrypts the nonce, the user and the token to an
# RSA-OAEP key made for that one login.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
# The token lives in the OS keyring, never in a plain file.
keyring-core = "1"
open = "5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
jiff = "0.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rodio = "0.21"
# Recording voice messages from the microphone: the cpal rodio already
# brings, so one copy plays and records.
cpal = "0.16"
# Voice messages are Opus in OGG, as Discord's phone app records them.
opus2 = { version = "0.4", features = ["bundled"] }
ogg = "0.9"
emojis = "0.9.1"
# Spell checking in the message field, with Hunspell dictionaries.
spellbook = "0.4.2"
rfd = "0.17.2"
# Voice calls as Discord's web client makes them: libwebrtc (the
# browser's engine: the platform audio device, echo cancellation, NetEq,
# Opus) talking to Discord's voice servers over WebRTC, with Discofast's
# hooks for DAVE (see vendor/webrtc-sys/src/discofast.cpp). The prebuilt
# library comes at build time.
libwebrtc = "0.3.55"
# DAVE, Discord's end-to-end encryption, on each encoded frame.
davey = "0.1.5"
# The web client's voice activity reads the microphone's spectrum.
realfft = "3.5"
# Watching screen shares (the `video` feature): the transport ciphers.
aes-gcm = { version = "0.10.3", optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
# Camera and screen on the user's own LiveKit server (the `selfhosted`
# feature). libwebrtc comes prebuilt at build time; the access token is
# made here from the server's key, so no service of ours is involved.
# "glib-main-loop" runs the GLib loop the Wayland screen portal answers on.
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-native-roots", "glib-main-loop"], optional = true }
livekit-api = { version = "0.10", default-features = false, features = ["access-token"], optional = true }

[features]
# Every build has the self-hosted camera and screen sharing.
default = ["selfhosted"]
# Watching someone's screen share in a call. Written without a chance to
# try it against Discord, so off until it is.
video = ["dep:aes-gcm", "dep:chacha20poly1305", "tokio/net"]
# Camera and screen sharing between friends on their own LiveKit server,
# set in the voice settings.
selfhosted = ["dep:livekit", "dep:livekit-api"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

# RSA key generation takes seconds in an unoptimized build.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[patch.crates-io]
# libwebrtc with Discofast's hooks for Discord's voice: encoded frames
# through DAVE, per-user volume, and a tap on the sound devices; see
# vendor/webrtc-sys/src/discofast.cpp.
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }
# crmne/egui apps-0.36.2, shared with Spotifast and ZapFast. Every egui crate
# comes from the same revision so they share one emath and epaint.
ecolor = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
eframe = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
emath = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
# crmne/winit apps-0.30: Wayland occlusion and clipboard fixes the apps share.
winit = { git = "https://github.com/crmne/winit", rev = "0bed9dc0a7db02590a279fb8bac795fa39ee6948" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
