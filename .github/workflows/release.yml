name: Release

# Every push to main whose Cargo.toml version has no tag yet builds
# FastDisco for Linux, Windows and macOS and publishes a GitHub release
# tagged v<version>. Bumping the version is what makes a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # libopus is built from its bundled source into the binary, so no
  # platform needs it installed.
  LIBOPUS_STATIC: "1"
  LIBOPUS_NO_PKG: "1"
  # The libopus bundled with audiopus_sys asks for CMake older than 3.5,
  # which CMake 4 refuses unless told this.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  version:
    name: new version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released."
          else
            echo "Releasing $tag."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The binary needs the glibc it was built against or newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first
      # use, then the target's standard library is added to it.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libdbus-1-dev clang cmake perl
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="fastdisco-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fastdisco.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/fastdisco" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            binary="target/${{ matrix.target }}/release/fastdisco"
            cp contrib/fastdisco.desktop "dist/$name/"
            mkdir -p "dist/$name/icons"
            for size in 32 64 128 256 512; do
              "$binary" write-icon "dist/$name/icons/$size.png" "$size"
            done
            # One file for Ubuntu and other desktops: download, chmod +x, run.
            scripts/appimage.sh "$binary" "dist/FastDisco-${{ needs.version.outputs.tag }}-x86_64.AppImage"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, build]
    # A platform that fails to build leaves the others still released.
    if: ${{ !cancelled() && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls dist/* >/dev/null
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s' $range
            echo
            echo "> **Warning:** Discord's Terms of Service do not allow third-party clients that log in with a user account. Use FastDisco at your own risk."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FastDisco ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
          make_latest: true

  # Arch users install with `yay -S fastdisco-bin`. Needs the
  # AUR_SSH_PRIVATE_KEY secret, a key added to the AUR account; without it
  # this step only says so.
  aur:
    name: AUR package
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Publish fastdisco-bin
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret, so the AUR package was not updated."
            exit 0
          fi
          pacman -Syu --noconfirm --needed git openssh
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/fastdisco-$TAG-x86_64-unknown-linux-gnu.tar.gz"
          sum=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/fastdisco-bin.git /tmp/aur
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" \
              -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD
          # makepkg refuses to run as root.
          useradd -m builder
          chmod -R a+rX /tmp/aur
          su builder -c "cd /tmp/aur && makepkg --printsrcinfo" > /tmp/aur/.SRCINFO
          cd /tmp/aur
          git config user.name "FastDisco release"
          git config user.email "th3-Rocha@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $version" || exit 0
          git push origin HEAD:master
