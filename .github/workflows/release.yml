name: Release

# Every push to main whose Cargo.toml version has no tag yet builds
# Discofast for Linux, Windows and macOS and publishes a GitHub release
# tagged v<version>. Bumping the version is what makes a release.

on:
  push:
    branches: [main]
    # The website deploys on Vercel; changing it alone builds nothing here.
    paths-ignore: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # libopus is built from its bundled source into the binary, so no
  # platform needs it installed.
  LIBOPUS_STATIC: "1"
  LIBOPUS_NO_PKG: "1"
  # The libopus bundled with libopus_sys may ask for CMake older than 3.5,
  # which CMake 4 refuses unless told this.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  version:
    name: new version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released."
          else
            echo "Releasing $tag."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The binary needs the glibc it was built against or newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first
      # use, then the target's standard library is added to it.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libdbus-1-dev clang cmake perl
          # LiveKit's libwebrtc, for the selfhosted feature.
          sudo apt-get install -y libglib2.0-dev libva-dev libdrm-dev libgbm-dev libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev libpipewire-0.3-dev libpulse-dev
          # Its libc++ wants clang 21 or newer; Ubuntu 24.04 ships 18.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      # LiveKit's libwebrtc is built against the static C runtime on
      # Windows, so the rest has to match it.
      - name: Static C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      # Camera and screen through the friends' own LiveKit server.
      - run: cargo build --locked --release --features selfhosted --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="discofast-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/discofast.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/discofast" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          # Marks an unpacked copy as one that may update itself.
          if [ "${{ runner.os }}" != "macOS" ]; then
            echo "discofast-portable-v1" > "dist/$name/discofast-portable.txt"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            binary="target/${{ matrix.target }}/release/discofast"
            cp contrib/discofast.desktop "dist/$name/"
            mkdir -p "dist/$name/icons"
            for size in 32 64 128 256 512; do
              "$binary" write-icon "dist/$name/icons/$size.png" "$size"
            done
            # One file for Ubuntu and other desktops: download, chmod +x, run.
            # The name the updater looks for: no "v", the processor alone.
            tag="${{ needs.version.outputs.tag }}"
            scripts/appimage.sh "$binary" "dist/discofast-${tag#v}-x86_64.AppImage"
          fi
          # Copies under FastDisco's old names, which installs from 0.9 and
          # earlier look for: their updater takes the archive's `fastdisco`
          # executable, or the `fastdisco-*.AppImage`, and the new version
          # then moves itself onto the Discofast name.
          legacy=""
          if [ "${{ runner.os }}" != "macOS" ]; then
            legacy="fastdisco-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
            mkdir -p "dist/$legacy"
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "dist/$name/discofast.exe" "dist/$legacy/fastdisco.exe"
            else
              cp "dist/$name/discofast" "dist/$legacy/fastdisco"
            fi
            cp README.md LICENSE "dist/$legacy/"
            echo "fastdisco-portable-v1" > "dist/$legacy/fastdisco-portable.txt"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            tag="${{ needs.version.outputs.tag }}"
            cp "dist/discofast-${tag#v}-x86_64.AppImage" "dist/fastdisco-${tag#v}-x86_64.AppImage"
          fi
          cd dist
          for dir in "$name" $legacy; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              7z a "$dir.zip" "$dir"
            else
              tar czf "$dir.tar.gz" "$dir"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, build]
    # A platform that fails to build leaves the others still released.
    if: ${{ !cancelled() && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What Discofast's updater checks: every file's SHA-256, signed with
      # the key whose public half is in assets/update-public-key.hex.
      - name: Checksums
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret: this release is not signed, and installed copies will not update to it."
            exit 0
          fi
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in checksums.txt -out checksums.txt.sig
          rm -f "$key"
          test "$(stat -c %s checksums.txt.sig)" = 64
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls dist/* >/dev/null
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s' $range
            echo
            echo "> **Warning:** Discord's Terms of Service do not allow third-party clients that log in with a user account. Use Discofast at your own risk."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Discofast ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
          make_latest: true

  # Arch users install with `yay -S discofast-bin`; fastdisco-bin, from
  # before the rename, is now an empty package that depends on it. Needs
  # the AUR_SSH_PRIVATE_KEY secret, a key added to the AUR account; without
  # it this step only says so.
  aur:
    name: AUR packages
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Publish discofast-bin and fastdisco-bin
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret, so the AUR packages were not updated."
            exit 0
          fi
          pacman -Syu --noconfirm --needed git openssh
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/discofast-$TAG-x86_64-unknown-linux-gnu.tar.gz"
          sum=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          # makepkg refuses to run as root.
          useradd -m builder
          for pkg in discofast-bin fastdisco-bin; do
            dir="/tmp/aur/$pkg"
            # A package the AUR does not have yet clones empty; the push creates it.
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$dir"
            sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" \
                -e "s/^sha256sums=('SKIP')/sha256sums=('$sum')/" "packaging/aur/$pkg/PKGBUILD" > "$dir/PKGBUILD"
            chmod -R a+rX /tmp/aur
            su builder -c "cd $dir && makepkg --printsrcinfo" > "$dir/.SRCINFO"
            git -C "$dir" config user.name "Discofast release"
            git -C "$dir" config user.email "th3-Rocha@users.noreply.github.com"
            git -C "$dir" add PKGBUILD .SRCINFO
            git -C "$dir" commit -m "Update to $version" || continue
            git -C "$dir" push origin HEAD:master
          done
